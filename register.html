<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SmartExam</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <a class="brand center" href="/">Smart<span>Exam</span></a>
        <h1>Student Registration</h1>
        <p class="muted">Create your student account.</p>

        <form id="registerForm">
            <label>Name</label>
            <input id="name" type="text" placeholder="Enter your name" required>

            <label>Email</label>
            <input id="email" type="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input id="password" type="password" placeholder="Minimum 6 characters" minlength="6" required>

            <button class="btn full" type="submit">Register</button>
            <p id="message" class="message"></p>
        </form>

        <p class="auth-link">Already have an account? <a href="/login.html">Login</a></p>
        <p class="auth-link">Are you a teacher? <a href="/teacher-register.html">Teacher Registration</a></p>
    </div>
    <script src="/js/common.js"></script>
    <script src="/js/register.js"></script>
</body>
</html>
