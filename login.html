<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartExam</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .register-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;align-items:center;justify-content:center}
        .register-box{width:90%;max-width:500px;background:#fff;border-radius:20px;padding:35px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
        .register-box h2{margin-bottom:10px}.register-box p{margin-bottom:25px}
        .register-options{display:grid;grid-template-columns:1fr 1fr;gap:15px}
        .register-option{border:none;border-radius:15px;padding:25px 15px;cursor:pointer;font-size:16px;font-weight:600;transition:.2s}
        .register-option:hover{transform:translateY(-4px)}
        .student-option{background:#e8f1ff;color:#2563eb}.teacher-option{background:#f3e8ff;color:#7c3aed}
        .cancel-button{margin-top:20px;border:none;background:transparent;color:#666;cursor:pointer;font-size:15px}
        .register-link-button{border:none;background:none;color:#635bff;cursor:pointer;font-size:inherit;font-weight:600;padding:0}
        @media(max-width:600px){.register-options{grid-template-columns:1fr}}
    </style>
</head>
<body class="auth-page">
<div class="auth-card">
    <a class="brand center" href="/">Smart<span>Exam</span></a>
    <h1>Welcome Back</h1>
    <p class="muted">Login to continue to SmartExam.</p>
    <form id="loginForm">
        <label>Email</label>
        <input id="email" type="email" placeholder="Enter your email" required>
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>
        <button class="btn full" type="submit">Login</button>
        <p id="message" class="message"></p>
    </form>
    <p class="auth-link">Don't have an account? <button type="button" class="register-link-button" onclick="showRegisterChoice()">Register</button></p>
</div>

<div id="registerModal" class="register-modal">
    <div class="register-box">
        <h2>Choose Registration Type</h2>
        <p class="muted">Select your account type</p>
        <div class="register-options">
            <button type="button" class="register-option student-option" onclick="goToStudentRegistration()">👨‍🎓<br><br>Student Registration</button>
            <button type="button" class="register-option teacher-option" onclick="goToTeacherRegistration()">👩‍🏫<br><br>Teacher Registration</button>
        </div>
        <button type="button" class="cancel-button" onclick="closeRegisterChoice()">Cancel</button>
    </div>
</div>

<script>
function showRegisterChoice(){document.getElementById("registerModal").style.display="flex";}
function closeRegisterChoice(){document.getElementById("registerModal").style.display="none";}
function goToStudentRegistration(){window.location.href="/register.html";}
function goToTeacherRegistration(){window.location.href="/teacher-register.html";}
document.getElementById("registerModal").addEventListener("click",function(event){if(event.target===this)closeRegisterChoice();});
</script>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
